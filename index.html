<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KicksVault | Métricas, Inventario y Ventas</title>
  <meta name="description" content="Dashboard consolidado de métricas, filtros avanzados, inventario y ventas de sneakers en memoria.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-icon">👟</div>
        <div class="brand-text">
          <h1>KicksVault</h1>
          <span>Analytics & POS</span>
        </div>
      </div>

      <nav>
        <ul class="nav-menu">
          <li>
            <a href="#stats" class="nav-item active" data-view="stats">
              <span class="icon">📊</span>
              <span>Dashboard & Métricas</span>
            </a>
          </li>
          <li>
            <a href="#inventory" class="nav-item" data-view="inventory">
              <span class="icon">📦</span>
              <span>Inventario (ABM)</span>
            </a>
          </li>
          <li>
            <a href="#sales" class="nav-item" data-view="sales">
              <span class="icon">🛒</span>
              <span>Ventas (ABM)</span>
            </a>
          </li>
          <li>
            <a href="#catalog" class="nav-item" data-view="catalog">
              <span class="icon">🗂️</span>
              <span>Catálogo Visual</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <p><strong>Modo:</strong> En Memoria</p>
        <p>v2.0.0 &bull; Vanilla JS</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="page-title">
          <h2 id="current-page-title">Métricas y Filtros Avanzados</h2>
          <p id="current-page-desc">Dashboard ejecutivo consolidado con exportación de reportes</p>
        </div>
      </header>

      <section class="content-body" id="view-container">
        <!-- Renderizado dinámico de módulos -->
      </section>
    </main>
  </div>

  <!-- Entry Script (ES Modules) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
